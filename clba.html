function pullAct(){
  if(actBusy)return;actBusy=true;
  fetch(DB+"/activity.json?orderBy=%22%24key%22&limitToLast=60").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){
    actBusy=false;
    ACT=Object.keys(o||{}).map(function(k){return o[k]}).filter(function(a){return a&&typeof a.t=="number"}).sort(function(a,b){return b.t-a.t});
    var mt=ACT.length?ACT[0].t:0;
    if(firstAct){firstAct=false;if(!getSeen())setSeen(mt||Date.now())}
    else{var nw=ACT.filter(function(a){return a.t>maxT&&others(a)});if(nw.length)alertNew(nw[0])}
    maxT=Math.max(maxT,mt);badge();

function put(i,f,delay){
  var k=K[i];S[k]=S[k]||{};
  for(var p in f){if(f[p]===null)delete S[k][p];else S[k][p]=f[p]}

  if(delay){var body={};for(var p2 in f)body[p2]=f[p2];tmr[k+"n"]=setTimeout(function(){send(k,body)},delay)}

  g+=f.deals.map(function(d){var c=/funded/i.test(d.o)?"dg":/declined/i.test(d.o)?"dr":"dm";
    return '<div class="deal"><span class="dn">'+esc(d.n)+'</span><span class="do '+c+'">'+esc(d.o)+(d.amt?' · '+esc(d.amt):'')+'</span><div class="dd">'+(d.dt?esc(d.dt):fd(d.d))+(d.x?' · '+esc(d.x):'')+'</div></div>'}).join("");
  g+='<div class="h" style="margin-top:8px">Contacts in Salesforce</div>'+f.contacts.map(function(c){
    return '<div class="sfc">'+esc(c.n)+(c.x?' <span class="dd">('+esc(c.x)+')</span>':'')+' · <a href="mailto:'+esc(c.e)+'">'+esc(c.e)+'</a></div>'}).join("");
  return g+'</div>'}
function card(i){
  var d=D[i],ln=eff(i),s=S[K[i]]||{},x=xi(i),r=role(i,x),P=ppl(i,x),T=types(x),moved=ln!=d[0],web=x.web||d[2];
  var sub=lab(ln)+(r?" · "+r:"")+(x.fit?" · "+x.fit:"")+(x.sub?" · Last sub "+fd(x.sub):"");
  var mv='';for(var k in L){mv+='<button class="'+k+(k==ln?' cur':'')+'" data-mv="'+i+'|'+k+'">'+L[k]+'</button>'}
  var kv=[["Location",x.loc],["Our contact",x.our],["Signed up",fd(x.signup)],["Lead created",fd(x.lead)],["Last submission",fd(x.sub)]].filter(function(a){return a[1]&&a[1]!="Not stated"&&a[1]!="Not found"});
  var fc=!x.fit?"":/not/i.test(x.fit)?"fN":/possible/i.test(x.fit)?"fP":"fS";
  var h='<details data-i="'+i+'" class="c '+ln+(x.sp?" spx":"")+(s.met?" met":"")+'"><summary><span class="nm">'+esc(d[1])+
    '<div class="lst">'+esc(sub)+'</div>'+(x.what?'<div class="wh">'+esc(x.what)+'</div>':'')+'</span>'+(x.sf?'<span class="tag sf">In Salesforce</span>':'')+(x.hist?'<span class="tag hs">Past contact</span>':'')+(x.sp?'<span class="tag sp">★ Sponsor</span>':'')+(s.met?'<span class="tag m">Met</span>':'')+
    (moved?'<span class="tag mv2">moved</span>':'')+'</summary><div class="body">';
  h+=sfBox(x);
  if(x.blurb)h+='<div class="box"><div class="h">About</div>'+esc(x.blurb)+'</div>';
  else if(x.what)h+='<div class="box"><div class="h">What they do'+(x.spn&&x.spn!=d[1]?' (sponsor listing: '+esc(x.spn)+')':'')+'</div>'+esc(x.what)+'</div>';
  else h+='<div class="none">Specialty not confirmed. Ask what loans and industries they focus on.</div>';
  if(x.fit)h+='<div class="box fit '+fc+'"><div class="h">'+esc(x.fit)+(x.ptype?' · '+esc(x.ptype):'')+'</div>'+esc(x.why||x.whynot||"")+'</div>';
  if(x.warn)h+=x.warn.map(function(w){return '<div class="box warn">⚠ '+esc(w)+'</div>'}).join("");
  h+=P.length?'<div class="box"><div class="h">Attending</div>'+P.map(function(p){var c=tc(p.t);
      return '<div class="pp"><div class="pn">'+esc(p.n)+(p.t?'<br><span class="tt '+c+'">'+esc(p.t)+'</span>'+(p.tc?' <span class="cf">confirm</span>':''):'')+'</div>'+
        (p.e?'<a class="li s" href="mailto:'+esc(p.e)+'">Email</a>':'')+
        '<a class="li'+(p.li?"":" s")+'" href="'+esc(liu(p,i))+'" target="_blank" rel="noopener">'+(p.li?"in Profile":"in Search")+'</a></div>'}).join("")+'</div>'
    :'<div class="none">Attendee name not confirmed</div>';
  h+=kv.length?'<div class="box"><dl class="kv">'+kv.map(function(a){return '<dt>'+a[0]+'</dt><dd>'+esc(a[1])+'</dd>'}).join("")+'</dl></div>':'';
  if(d[3]||x.sam)h+='<div class="box note"><div class="h">Our notes</div>'+esc(d[3])+(x.sam?(d[3]?'\n':'')+esc(x.sam):'')+'</div>';
  h+='<div class="row">'+(web?'<a href="'+esc(web)+'" target="_blank" rel="noopener">Open website</a>':'<div class="web">'+esc(d[4]||"No website")+'</div>')+
    '<a href="https://www.linkedin.com/search/results/companies/?keywords='+encodeURIComponent(x.spn||d[1])+'" target="_blank" rel="noopener">Company LinkedIn</a></div><div class="row">'+
    '<button class="mm" data-m="'+i+'">'+(s.met?"Unmark met":"Mark as met")+'</button></div>'+
    '<div class="mvl">Move to list:</div><div class="mv">'+mv+'</div>'+
    (moved?'<button class="rv" data-mv="'+i+'|'+d[0]+'">Return to original list ('+lab(d[0])+')</button>':'')+
    '<textarea data-n="'+i+'" placeholder="My notes from the conversation…">'+esc(s.n||"")+'</textarea></div></details>';
  return h;
}
function FR(f){return {"Strong fit":0,"Good fit":1,"Possible fit":2,"Not a fit":3}[f]??4}
function render(){
  var q=st.q.toLowerCase(),idx=[];
  D.forEach(function(d,i){
    var ln=eff(i),s=S[K[i]]||{},x=xi(i);
    if(st.tab=="sp"){if(!x.sp)return}else if(st.tab!="all"&&ln!=st.tab)return;
    if(st.info&&!d[3])return;
    if(st.unmet&&s.met)return;
    if(q){var hay=[d[1],d[3],x.what,x.spn,x.blurb,x.loc,x.fit,x.why,x.whynot,x.sam,s.n,x.our,x.tnote,types(x).join(" "),role(i,x)].concat(ppl(i,x).map(function(p){return p.n+" "+(p.t||"")})).join(" ").toLowerCase();if(hay.indexOf(q)<0)return}
    idx.push(i);
  });
  idx.sort(function(a,b){
    var la=RK[eff(a)],lb=RK[eff(b)];if(la!=lb)return la-lb;
    if(st.tab=="sp"||eff(a)=="spo"){var fa=FR(xi(a).fit),fb=FR(xi(b).fit);if(fa!=fb)return fa-fb}
    var ta=(S[K[a]]||{}).t||0,tb=(S[K[b]]||{}).t||0;if(ta!=tb)return tb-ta;
    return a-b;
  });
  document.getElementById("list").innerHTML=idx.map(card).join("")||'<div class="none">No matches</div>';
  document.getElementById("cnt").textContent=idx.length+" companies";
  document.getElementById("fi").className=st.info?"on":"";
  document.getElementById("fm").className=st.unmet?"on":"";
}
function refresh(){
  var open=[].map.call(document.querySelectorAll("details.c[open]"),function(d){return d.dataset.i});
  var y=window.scrollY;tabs();render();
  open.forEach(function(i){var d=document.querySelector('details[data-i="'+i+'"]');if(d)d.open=true});
  window.scrollTo(0,y);
}
function busy(){return st.edit!==null||(document.activeElement&&document.activeElement.tagName=="TEXTAREA")}
function pull(){
  fetch(DB+"/clba.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    S=d||{};cache();status("● Live","ok");
    if(busy()){pend=true}else{pend=false;refresh()}
  }).catch(function(){status("○ Offline – showing saved copy","bad")});
}
function live(){
  if(!DB){status("○ Local only","bad");return}
  status("… connecting");pull();loadHook();liveAct();
  try{
    var es=new EventSource(DB+"/clba.json");
    es.addEventListener("put",pull);es.addEventListener("patch",pull);
    es.onerror=function(){status("○ Reconnecting…","bad")};
  }catch(e){setInterval(pull,5000)}
}

// ----- editing details -----
function openEdit(i){
  var x=xi(i);
  st.edit=i;st.dr={sp:!!x.sp,role:x.role||"",types:types(x),tnote:x.tnote||"",our:x.our||"",signup:x.signup||"",lead:x.lead||"",sub:x.sub||"",
    ppl:ppl(i,x).map(function(p){return{n:p.n||"",t:p.t||"",li:p.li||""}})};
  refresh();
}
function closeEdit(){st.edit=null;st.dr=null;pend=false;refresh()}
function saveEdit(i){
  var o=xi(i),d=st.dr,cur=(S[K[i]]||{}).x||{},nx={},p,ch=[];
  for(p in cur)nx[p]=cur[p];
  for(p in F){var nv=(d[p]||"").trim(),ov=o[p]||"";if(nv!==ov){nx[p]=nv;ch.push(F[p]+": "+(nv?(/signup|lead|sub/.test(p)?fd(nv):nv):"(cleared)"))}}
  if(!!d.sp!==!!o.sp){nx.sp=!!d.sp;ch.push(d.sp?"Marked as sponsor ★":"No longer a sponsor")}
  var tn=d.types.join("|");if(tn!==types(o).join("|")){nx.types=tn;ch.push("Type: "+(d.types.join(", ")||"(cleared)"))}
  var np=d.ppl.map(function(q){return{n:q.n.trim(),t:q.t.trim(),li:q.li.trim()}}).filter(function(q){return q.n});
  var op=ppl(i,o).map(function(q){return{n:q.n||"",t:q.t||"",li:q.li||""}});
  if(JSON.stringify(np)!==JSON.stringify(op)){
    if(np.length){nx.ppl=np;delete nx.ppl0}else{nx.ppl0=true;delete nx.ppl}
    ch.push("Attending: "+(np.map(function(q){return q.n+(q.t?" ("+q.t+")":"")}).join(", ")||"(none)"));
  }
  if(ch.length){
    put(i,{x:nx});
    slack("*"+sesc(who(true))+"* updated *"+sesc(D[i][1])+"*:\n"+ch.map(function(c){return "• "+sesc(c)}).join("\n"));
    toast("Saved details for "+D[i][1]);
  }else toast("Nothing changed");
  closeEdit();
}

// ----- events -----
document.getElementById("q").oninput=function(e){st.q=e.target.value;render()};
document.getElementById("tabs").onclick=function(e){var t=e.target.closest("button");if(t){st.tab=t.dataset.t;tabs();render()}};
document.getElementById("fi").onclick=function(){st.info=!st.info;render()};
document.getElementById("fm").onclick=function(){st.unmet=!st.unmet;render()};
document.getElementById("me").onclick=function(){var n=prompt("Your name (shown in Slack updates):",myName());if(n!==null){n=n.trim();if(n)setName(n)}};
document.getElementById("list").onclick=function(e){
  var b;
  if(b=e.target.closest("button[data-mv]")){
    var p=b.dataset.mv.split("|"),i=+p[0],to=p[1],from=eff(i);
    if(from==to)return;
    if(to==D[i][0])put(i,{l:null,t:null});else put(i,{l:to,t:Date.now()});
    slack("*"+sesc(who(true))+"* moved *"+sesc(D[i][1])+"* from "+lab(from)+" → *"+L[to]+"*");
    refresh();toast(D[i][1]+" → "+L[to]);return;
  }
  if(b=e.target.closest("button[data-m]")){
    var i2=+b.dataset.m,s2=S[K[i2]]||{},nowMet=!s2.met;
    put(i2,{met:nowMet?true:null});
    slack("*"+sesc(who(true))+"* "+(nowMet?"marked *"+sesc(D[i2][1])+"* as met ✅":"unmarked *"+sesc(D[i2][1])+"* as met"));
    refresh();return;
  }
  if(b=e.target.closest("button[data-e]")){openEdit(+b.dataset.e);return}
  if(b=e.target.closest("button[data-ty]")){
    var t=b.dataset.ty,a=st.dr.types,k=a.indexOf(t);
    if(k>=0)a.splice(k,1);else a.push(t);b.classList.toggle("on");return;
  }
  if(e.target.closest("button[data-padd]")){st.dr.ppl.push({n:"",t:"",li:""});refresh();return}
  if(b=e.target.closest("button[data-pdel]")){st.dr.ppl.splice(+b.dataset.pdel,1);refresh();return}
  if(b=e.target.closest("button[data-save]")){saveEdit(+b.dataset.save);return}
  if(e.target.closest("button[data-cancel]")){closeEdit();return}
};
function onField(e){
  var t=e.target;
  if(st.dr&&t.dataset.f!==undefined){st.dr[t.dataset.f]=t.type=="checkbox"?t.checked:t.value;return}
  if(st.dr&&t.dataset.p!==undefined){var p=t.dataset.p.split("|");st.dr.ppl[+p[0]][p[1]]=t.value;return}
  if(e.type=="input"&&t.dataset.n!==undefined){
    var i=+t.dataset.n;put(i,{n:t.value||null},600);
    clearTimeout(nt[i]);nt[i]=setTimeout(function(){noteSlack(i)},8000);
  }
}
document.getElementById("list").addEventListener("input",onField);
document.getElementById("list").addEventListener("change",onField);
document.getElementById("list").addEventListener("focusin",function(e){
  if(e.target.tagName=="TEXTAREA"){var i=+e.target.dataset.n;if(!(i in nt))sent[i]=(S[K[i]]||{}).n||""}
});
document.getElementById("list").addEventListener("focusout",function(e){
  if(e.target.tagName!="TEXTAREA")return;
  var i=+e.target.dataset.n;if(i in nt){who(true);noteSlack(i)}
  if(pend&&st.edit===null){pend=false;setTimeout(refresh,50)}
});
meBtn();lcl();tabs();render();live();
</script></body></html>
